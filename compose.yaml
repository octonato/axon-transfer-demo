services:
  axon-server:
    image: docker.axoniq.io/axoniq/axonserver:2026.1.7
    hostname: axon-server
    ports:
      - "8024:8024"
      - "8124:8124"
    environment:
      axoniq_axonserver_name: axon-server
      axoniq_axonserver_hostname: localhost
      axoniq_axonserver_standalone_dcb: "true"
    volumes:
      - ./target/axonserver/data:/axonserver/data
      - ./target/axonserver/events:/axonserver/events
      - ./target/axonserver/log:/axonserver/log
