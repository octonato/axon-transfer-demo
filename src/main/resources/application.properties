spring.application.name=axon-transfer
spring.threads.virtual.enabled=true
server.port=9000
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
axon.workflow.initial-segment-count=1
axon.workflow.thread-count=1
spring.datasource.url=jdbc:h2:file:./target/axon-tokens
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
demo.wallet-directory=target/wallets
